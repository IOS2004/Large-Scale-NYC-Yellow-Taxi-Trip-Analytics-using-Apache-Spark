<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="100%" height="100%" style="background:#09090b; border-radius:12px; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#121215"/>
    </linearGradient>
    <linearGradient id="deltaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="mlGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="dashGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <!-- Markers -->
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b"/>
    </marker>
    <marker id="arrowZinc" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#71717a"/>
    </marker>
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981"/>
    </marker>

    <!-- Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Title / Badge -->
  <g transform="translate(40, 28)">
    <rect x="0" y="0" width="920" height="46" rx="8" fill="#18181b" stroke="#27272a" stroke-width="1"/>
    <circle cx="24" cy="23" r="6" fill="#f59e0b"/>
    <text x="40" y="28" fill="#f43f5e" font-size="12" font-weight="700" letter-spacing="1.5">ARCHITECTURE</text>
    <text x="145" y="28" fill="#e4e4e7" font-size="14" font-weight="600">NYC Yellow Taxi Distributed Big Data Pipeline (Spark 3.5 + Delta Lake 3.0)</text>
    <rect x="800" y="11" width="105" height="24" rx="12" fill="#27272a"/>
    <text x="822" y="27" fill="#fbbf24" font-size="11" font-weight="600">39.6M+ Records</text>
  </g>

  <!-- Flow Links (Lines) -->
  <!-- Raw -> Job 1 -->
  <line x1="220" y1="135" x2="270" y2="135" stroke="#71717a" stroke-width="2" marker-end="url(#arrowZinc)"/>
  <!-- Job 1 -> Delta 1 -->
  <line x1="560" y1="135" x2="610" y2="135" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrowCyan)"/>
  <!-- Delta 1 -> Job 2 -->
  <path d="M 740 135 L 780 135 Q 800 135 800 165 L 800 215 Q 800 245 780 245 L 740 245" fill="none" stroke="#71717a" stroke-width="2" marker-end="url(#arrowZinc)"/>

  <!-- Row 1: INGESTION & HARMONIZATION -->
  <!-- Card: Raw Parquet -->
  <g transform="translate(40, 100)" filter="url(#glow)">
    <rect width="180" height="70" rx="8" fill="url(#cardGrad)" stroke="#3f3f46" stroke-width="1.2"/>
    <text x="16" y="28" fill="#a1a1aa" font-size="10" font-weight="700" letter-spacing="1">RAW STORAGE</text>
    <text x="16" y="46" fill="#fafafa" font-size="13" font-weight="600">TLC Raw Parquet</text>
    <text x="16" y="60" fill="#71717a" font-size="10">Multi-year (2017-2026)</text>
  </g>

  <!-- Card: Job 1 TLCSchemaFixerJob -->
  <g transform="translate(270, 95)" filter="url(#glow)">
    <rect width="290" height="80" rx="8" fill="url(#cardGrad)" stroke="#f59e0b" stroke-width="1.5"/>
    <rect x="14" y="12" width="130" height="18" rx="4" fill="#451a03"/>
    <text x="20" y="25" fill="#fbbf24" font-size="10" font-weight="700">1. TLCSchemaFixerJob</text>
    <text x="14" y="48" fill="#fafafa" font-size="12" font-weight="600">Schema Harmonization &amp; Downcasting</text>
    <text x="14" y="65" fill="#a1a1aa" font-size="10">• Casts INT64 ➔ Byte/Short (Saves 40% RAM)</text>
  </g>

  <!-- Delta Lake 1 -->
  <g transform="translate(610, 107)" filter="url(#glow)">
    <rect width="130" height="56" rx="8" fill="url(#deltaGrad)" stroke="#38bdf8" stroke-width="1"/>
    <text x="14" y="24" fill="#e0f2fe" font-size="10" font-weight="700">DELTA TABLE</text>
    <text x="14" y="42" fill="#ffffff" font-size="12" font-weight="700">schema_fixed</text>
  </g>

  <!-- Row 2: CLEANING & FEATURE ENGINEERING -->
  <!-- Job 2 TLCDataCleanerJob -->
  <g transform="translate(270, 205)" filter="url(#glow)">
    <rect width="470" height="80" rx="8" fill="url(#cardGrad)" stroke="#10b981" stroke-width="1.5"/>
    <rect x="14" y="12" width="135" height="18" rx="4" fill="#064e3b"/>
    <text x="20" y="25" fill="#34d399" font-size="10" font-weight="700">2. TLCDataCleanerJob</text>
    <text x="14" y="48" fill="#fafafa" font-size="12" font-weight="600">Data Sanitization &amp; Feature Derivation</text>
    <text x="14" y="65" fill="#a1a1aa" font-size="10">• Filters 0.1-100 mi • Removes negative pass. • Extracts duration &amp; weekend flags</text>
  </g>

  <!-- Delta Lake 2 (Cleaned) -->
  <g transform="translate(40, 217)" filter="url(#glow)">
    <rect width="180" height="56" rx="8" fill="url(#deltaGrad)" stroke="#38bdf8" stroke-width="1"/>
    <text x="16" y="24" fill="#e0f2fe" font-size="10" font-weight="700">DELTA TABLE (ACID)</text>
    <text x="16" y="43" fill="#ffffff" font-size="13" font-weight="700">cleaned_tripdata</text>
  </g>

  <!-- Connector: Job 2 -> Delta 2 -->
  <line x1="270" y1="245" x2="220" y2="245" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrowCyan)"/>

  <!-- Connector: Delta 2 -> 3 Parallel Processing Tracks -->
  <!-- Split lines downward from Delta 2 (x=130, y=273) -->
  <path d="M 130 273 L 130 330" fill="none" stroke="#71717a" stroke-width="2"/>
  <path d="M 130 330 L 800 330" fill="none" stroke="#71717a" stroke-width="2"/>
  <!-- Branch 1: Advanced Analytics -->
  <line x1="180" y1="330" x2="180" y2="355" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrowAmber)"/>
  <!-- Branch 2: Machine Learning -->
  <line x1="500" y1="330" x2="500" y2="355" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrowZinc)"/>
  <!-- Branch 3: Data Analysis -->
  <line x1="800" y1="330" x2="800" y2="355" stroke="#10b981" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <!-- Row 3: THREE PARALLEL COMPUTATION ENGINES -->
  <!-- Engine 1: Advanced Analytics -->
  <g transform="translate(40, 360)" filter="url(#glow)">
    <rect width="280" height="120" rx="8" fill="url(#cardGrad)" stroke="#f59e0b" stroke-width="1.5"/>
    <rect x="14" y="12" width="165" height="18" rx="4" fill="#451a03"/>
    <text x="20" y="25" fill="#fbbf24" font-size="10" font-weight="700">3. TLCAdvancedAnalytics</text>
    <text x="14" y="48" fill="#fafafa" font-size="12" font-weight="600">Window Functions &amp; Optimization</text>
    <text x="14" y="66" fill="#f59e0b" font-size="10" font-weight="600">⚡ Broadcast Hash Join (5.1x Boost)</text>
    <text x="14" y="82" fill="#a1a1aa" font-size="10">• 7-Day Rolling Window (rowsBetween -6,0)</text>
    <text x="14" y="98" fill="#a1a1aa" font-size="10">• Hourly Zone Rank (Top 3 per hour)</text>
    <rect x="14" y="103" width="180" height="12" rx="3" fill="#27272a"/>
    <text x="18" y="112" fill="#71717a" font-size="9">Outputs: rolling_7_day, hourly_rank</text>
  </g>

  <!-- Engine 2: Machine Learning -->
  <g transform="translate(360, 360)" filter="url(#glow)">
    <rect width="280" height="120" rx="8" fill="url(#cardGrad)" stroke="#8b5cf6" stroke-width="1.5"/>
    <rect x="14" y="12" width="155" height="18" rx="4" fill="#2e1065"/>
    <text x="20" y="25" fill="#c4b5fd" font-size="10" font-weight="700">4. TLCMachineLearning</text>
    <text x="14" y="48" fill="#fafafa" font-size="12" font-weight="600">Distributed Tip Classifier</text>
    <text x="14" y="66" fill="#a78bfa" font-size="10" font-weight="600">🎯 AUC ROC: 0.892 (High Tiper &gt;20%)</text>
    <text x="14" y="82" fill="#a1a1aa" font-size="10">• VectorAssembler (4 Core Features)</text>
    <text x="14" y="98" fill="#a1a1aa" font-size="10">• RandomForest (10 Trees, Max Depth 5)</text>
    <rect x="14" y="103" width="160" height="12" rx="3" fill="#27272a"/>
    <text x="18" y="112" fill="#71717a" font-size="9">Model: /models/rf_tip_model</text>
  </g>

  <!-- Engine 3: Exploratory Analytics -->
  <g transform="translate(680, 360)" filter="url(#glow)">
    <rect width="280" height="120" rx="8" fill="url(#cardGrad)" stroke="#10b981" stroke-width="1.5"/>
    <rect x="14" y="12" width="130" height="18" rx="4" fill="#064e3b"/>
    <text x="20" y="25" fill="#34d399" font-size="10" font-weight="700">5. TLCDataAnalysis</text>
    <text x="14" y="48" fill="#fafafa" font-size="12" font-weight="600">Macro Exploratory Metrics</text>
    <text x="14" y="66" fill="#10b981" font-size="10" font-weight="600">📊 Seasonality &amp; Payment Trends</text>
    <text x="14" y="82" fill="#a1a1aa" font-size="10">• Weekend vs Weekday Hourly Volume</text>
    <text x="14" y="98" fill="#a1a1aa" font-size="10">• Borough Demographics &amp; CC Splits</text>
    <rect x="14" y="103" width="160" height="12" rx="3" fill="#27272a"/>
    <text x="18" y="112" fill="#71717a" font-size="9">Aggregates: /reports/eda_stats</text>
  </g>

  <!-- Connectors into Dashboard (Bottom) -->
  <line x1="180" y1="480" x2="180" y2="520" stroke="#f59e0b" stroke-width="2"/>
  <line x1="500" y1="480" x2="500" y2="520" stroke="#8b5cf6" stroke-width="2"/>
  <line x1="820" y1="480" x2="820" y2="520" stroke="#10b981" stroke-width="2"/>
  <path d="M 180 520 L 820 520" fill="none" stroke="#71717a" stroke-width="1.5"/>
  <line x1="500" y1="520" x2="500" y2="538" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrowAmber)"/>

  <!-- Row 4: EXECUTIVE DASHBOARD BANNER -->
  <g transform="translate(40, 540)" filter="url(#glow)">
    <rect width="920" height="60" rx="8" fill="#18181b" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="24" y="27" fill="#fbbf24" font-size="11" font-weight="700" letter-spacing="1">PRESENTATION TIER</text>
    <text x="24" y="47" fill="#fafafa" font-size="14" font-weight="600">Next.js 16 + React 19 Executive Analytics Workbench (Port 3000)</text>
    <text x="560" y="38" fill="#a1a1aa" font-size="11">• 24-Hr Hotspot Radar Scrubbing • ML Tip Simulator • Live Spark Metrics</text>
  </g>
</svg>
